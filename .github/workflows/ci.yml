# Mercury Code - Continuous Integration
# Runs tests on every push and pull request

name: CI

on:
  push:
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Node ${{ matrix.node }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['18', '20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
        env:
          INCEPTION_API_KEY: test-key-for-ci

  lint:
    name: Syntax Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check all JS files for syntax errors
        run: |
          node --check cli.js
          find src -name '*.js' -print0 | while IFS= read -r -d '' f; do
            node --check "$f" || exit 1
          done

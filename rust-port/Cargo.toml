[workspace]
members = [
    "crates/mercury-core",
    "crates/mercury-tools",
    "crates/mercury-safety",
    "crates/mercury-agents",
    "crates/mercury-ui",
    "crates/mercury-web",
    "crates/mercury-cli",
]
resolver = "2"

[workspace.package]
version = "1.4.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/LHAMNS/Cloud-code-for-mercury-2"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
# HTTP client with streaming
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls"] }
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# CLI
clap = { version = "4", features = ["derive"] }
# Terminal REPL
rustyline = "14"
crossterm = "0.28"
# Syntax highlighting
syntect = "5"
# Markdown rendering in terminal
termimad = "0.30"
# File globbing
glob = "0.3"
globset = "0.4"
# Regex
regex = "1"
# Web server + WebSocket
axum = { version = "0.7", features = ["ws"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "cors"] }
tokio-tungstenite = "0.24"
# LSP types
lsp-types = "0.97"
# Utilities
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
colored = "2"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
walkdir = "2"
tempfile = "3"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
once_cell = "1"
futures = "0.3"
async-trait = "0.1"
bytes = "1"
url = "2"
# Testing
assert_cmd = "2"
predicates = "3"

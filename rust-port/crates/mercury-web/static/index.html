<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mercury Code</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>☿</text></svg>" />
    <link rel="stylesheet" href="./styles.css" />
    <!-- KaTeX (LaTeX rendering) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" crossorigin="anonymous" />
    <!-- Highlight.js (code syntax highlighting) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/github-dark.min.css" crossorigin="anonymous" />
  </head>
  <body>
    <div class="noise-layer" aria-hidden="true"></div>

    <div class="app-shell">
      <!-- ─── Topbar ─────────────────────────────────────────────── -->
      <header class="topbar">
        <div class="brand">
          <div class="brand-icon" aria-hidden="true">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"/>
              <path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/>
              <path d="M2 12h20"/>
            </svg>
          </div>
          <div class="brand-text">
            <span class="brand-name">Mercury Code</span>
            <span class="brand-tag">Web Console</span>
          </div>
        </div>

        <nav class="topbar-controls">
          <div class="connection-indicator" id="connectionPill" data-state="connecting">
            <span class="indicator-dot" aria-hidden="true"></span>
            <span id="connectionLabel">Connecting</span>
          </div>
          <div class="topbar-buttons">
            <button class="btn btn--ghost btn--sm" id="refreshStatusButton" type="button" title="Refresh session status">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
              <span>Refresh</span>
            </button>
            <button class="btn btn--ghost btn--sm" id="newSessionButton" type="button" title="Start a new session">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
              <span>New Session</span>
            </button>
            <button class="btn btn--danger btn--sm" id="interruptButton" type="button" title="Interrupt current operation">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/></svg>
              <span>Stop</span>
            </button>
          </div>
        </nav>
      </header>

      <!-- ─── Main Grid ──────────────────────────────────────────── -->
      <main class="workspace">
        <!-- Terminal -->
        <section class="terminal-panel card">
          <div class="card-bar">
            <div class="card-title-group">
              <h2 class="card-title">Terminal</h2>
              <span class="card-badge" id="streamBadge">Live</span>
            </div>
            <div class="card-actions">
              <button class="btn btn--subtle btn--xs" id="copyOutputButton" type="button">Copy</button>
              <button class="btn btn--subtle btn--xs" id="clearViewportButton" type="button">Clear</button>
            </div>
          </div>

          <div class="terminal-viewport" id="terminalSurface">
            <div class="terminal-dots" aria-hidden="true">
              <span class="td td--r"></span>
              <span class="td td--y"></span>
              <span class="td td--g"></span>
              <span class="terminal-title-text">mercury ~</span>
            </div>
            <div class="terminal-output" id="terminalStream" role="log" aria-live="polite"></div>
          </div>
        </section>

        <!-- Sidebar -->
        <aside class="sidebar">
          <!-- Status Card -->
          <section class="card card--compact status-card">
            <div class="card-bar">
              <h2 class="card-title">Session</h2>
            </div>
            <dl class="kv-grid">
              <div class="kv-item">
                <dt>ID</dt>
                <dd id="sessionIdValue">--</dd>
              </div>
              <div class="kv-item">
                <dt>Mode</dt>
                <dd id="modeValue">web</dd>
              </div>
              <div class="kv-item kv-item--wide">
                <dt>Workspace</dt>
                <dd id="workspaceValue">--</dd>
              </div>
              <div class="kv-item">
                <dt>Trust</dt>
                <dd id="trustValue">--</dd>
              </div>
              <div class="kv-item">
                <dt>Sandbox</dt>
                <dd id="sandboxValue">--</dd>
              </div>
              <div class="kv-item kv-item--wide">
                <dt>Model</dt>
                <dd id="modelValue">--</dd>
              </div>
            </dl>
            <div class="badge-row" id="statusBadges"></div>
          </section>

          <!-- Quick Actions -->
          <section class="card card--compact">
            <div class="card-bar">
              <h2 class="card-title">Quick Actions</h2>
            </div>
            <div class="action-grid" id="quickActions">
              <button class="action-btn" type="button" data-command="/help">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
                Help
              </button>
              <button class="action-btn" type="button" data-command="/status">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
                Status
              </button>
              <button class="action-btn" type="button" data-command="/context">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
                Context
              </button>
              <button class="action-btn" type="button" data-command="/history list">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                History
              </button>
              <button class="action-btn" type="button" data-command="/sandbox">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                Sandbox
              </button>
              <button class="action-btn" type="button" data-command="/memory show">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
                Memory
              </button>
              <button class="action-btn" type="button" data-command="/trust approval">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
                Approval
              </button>
              <button class="action-btn" type="button" data-command="/compact">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 14 10 14 10 20"/><polyline points="20 10 14 10 14 4"/><line x1="14" y1="10" x2="21" y2="3"/><line x1="3" y1="21" x2="10" y2="14"/></svg>
                Compact
              </button>
            </div>
          </section>

          <!-- Shortcuts -->
          <section class="card card--compact card--muted">
            <div class="card-bar">
              <h2 class="card-title">Shortcuts</h2>
            </div>
            <div class="shortcut-list">
              <div class="shortcut-row"><kbd>Enter</kbd><span>Send message</span></div>
              <div class="shortcut-row"><kbd>Shift + Enter</kbd><span>New line</span></div>
              <div class="shortcut-row"><kbd>Ctrl + Enter</kbd><span>Force send</span></div>
            </div>
          </section>
        </aside>
      </main>

      <!-- ─── Composer ───────────────────────────────────────────── -->
      <footer class="composer card">
        <form id="composerForm" class="composer-inner">
          <label class="sr-only" for="composer">Message composer</label>
          <textarea
            id="composer"
            name="composer"
            rows="4"
            spellcheck="false"
            autocomplete="off"
            placeholder="Ask Mercury anything, or type / for commands..."
          ></textarea>

          <div class="composer-bar">
            <div class="composer-meta">
              <span id="lineCounter">1 line</span>
              <span class="meta-sep" aria-hidden="true"></span>
              <span id="charCounter">0 chars</span>
              <span class="meta-sep" aria-hidden="true"></span>
              <span id="composerHint" class="composer-status">Ready</span>
            </div>
            <div class="composer-actions">
              <button class="btn btn--ghost btn--sm" id="clearComposerButton" type="button">Clear</button>
              <button class="btn btn--primary btn--sm" id="sendButton" type="submit">
                Send
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
              </button>
            </div>
          </div>
        </form>
      </footer>
    </div>

    <template id="statusBadgeTemplate">
      <span class="pill"></span>
    </template>

    <!-- Markdown rendering -->
    <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js" crossorigin="anonymous"></script>
    <!-- KaTeX JS -->
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" crossorigin="anonymous"></script>
    <!-- Highlight.js JS -->
    <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js" crossorigin="anonymous"></script>

    <script type="module" src="./app.js"></script>
  </body>
</html>
